# Bump version on main only. Does not tag or publish.
# After this succeeds: git tag vX.Y.Z && git push origin vX.Y.Z
name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: "Bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          previous=$(uvx bump-my-version show current_version)
          uvx bump-my-version bump "${{ inputs.bump-type }}"
          current=$(uvx bump-my-version show current_version)
          echo "previous-version=${previous}" >> "$GITHUB_OUTPUT"
          echo "current-version=${current}" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Push version commit
        run: |
          git push
          echo "Bumped ${{ steps.bump.outputs.previous-version }} → ${{ steps.bump.outputs.current-version }}."
          echo "Publish with: git tag v${{ steps.bump.outputs.current-version }} && git push origin v${{ steps.bump.outputs.current-version }}"
